<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Seating Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  

    <header class="app-header">
        <h1>Concert Hall</h1>
        <p>Select a seat to inspect its details and price.</p>
    </header>

    <main class="app-container">
        <section class="map-section">
            <div class="stage-container">
                <div class="stage">STAGE</div>
            </div>
            
            <div id="venue-map" class="venue-map">
            </div>

            <div class="legend">
                <div class="legend-item"><span class="seat-sample available"></span> Mövcud (Available)</div>
                <div class="legend-item"><span class="seat-sample inspected"></span> Seçilmiş/Yoxlanılır (Inspected)</div>
                <div class="legend-item"><span class="seat-sample unavailable"></span> Dolu (Unavailable)</div>
            </div>
        </section>

        <aside class="sidebar">
            <div class="panel inspection-panel">
                <h2>Seat Inspection</h2>
                <div id="seat-details" class="seat-details">
                    <p class="placeholder-text">No seat selected. Click a seat on the map to inspect.</p>
                </div>
                <button id="add-to-cart-btn" class="btn primary-btn" disabled>ADD TO CART</button>
            </div>

            <div class="panel cart-panel">
                <h2>Cart (Week 3 feature preview)</h2>
                <div id="cart-items" class="cart-items">
                    <p class="placeholder-text">Cart is empty.</p>
                </div>
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="total-price">0.00 AZN</span>
                </div>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
