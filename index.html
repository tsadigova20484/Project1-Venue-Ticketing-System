
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concert Hall Ticketing</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Concert Hall</h1>
    <p>Select your preferred seating zone</p>
  </header>

  <main>
    <section class="venue">
      <h2>Venue Layout</h2>
      <div class="stage">STAGE</div>
      <div class="zone vip">VIP — 150 AZN</div>
      <div class="zone premium">Premium — 80 AZN</div>
      <div class="zone standard">Standard — 50 AZN</div>
    </section>
  </main>
</body>
</html>
